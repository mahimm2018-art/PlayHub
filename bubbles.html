<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adi's Bubble Pop</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            font-family: 'Fredoka', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 100;
            padding: 10px 15px; background: rgba(0,0,0,0.1); border: none; border-radius: 8px;
            font-size: 1rem; cursor: pointer; color: #333; font-family: sans-serif;
        }
        #back-btn:active { background: rgba(0,0,0,0.2); }

        canvas {
            display: block; width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        #instruction {
            font-size: clamp(1.2rem, 3.5vw, 2.5rem); color: #fff;
            text-shadow: 0px 3px 10px rgba(0,0,0,0.2);
            animation: pulse 2s infinite; text-align: center;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <button id="back-btn" ondblclick="window.location.href='index.html'" onkeydown="if(event.key==='Enter') window.location.href='index.html'">
        Double-Tap / Esc to Exit
    </button>

    <canvas id="canvas"></canvas>
    
    <div id="ui-layer">
        <div id="instruction">Pop the Bubbles!</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');

        let width, height;
        let bubbles = [];
        let particles = [];
        let frameCount = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let audioCtx = null;
        let audioStarted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioStarted = true;
            instruction.style.display = 'none';
        }

        function playPopSound() {
            if (!audioStarted || !audioCtx) return;
            const t = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(150, t + 0.1);
            
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(t);
            osc.stop(t + 0.1);
        }

        class Bubble {
            constructor(x, y) {
                this.r = Math.random() * 30 + 30;
                this.x = x !== undefined ? x : Math.random() * (width - this.r * 2) + this.r;
                this.y = y !== undefined ? y : height + this.r;
                
                this.speedY = -(Math.random() * 1.5 + 0.5);
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
                this.wobbleDistance = Math.random() * 1.5;
                this.wobbleOffset = Math.random() * Math.PI * 2;
                
                this.hue = Math.random() * 360;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(frameCount * this.wobbleSpeed + this.wobbleOffset) * this.wobbleDistance;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.beginPath();
                ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, 0.25)`;
                ctx.fill();
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 85%, 0.8)`;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(-this.r * 0.35, -this.r * 0.35, this.r * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.r = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.hue = hue;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.04;
                this.vy += 0.2; 
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${this.life})`;
                ctx.fill();
            }
        }

        function popBubble(index) {
            const b = bubbles[index];
            playPopSound();
            
            for(let i = 0; i < 8; i++) {
                particles.push(new Particle(b.x, b.y, b.hue));
            }
            
            bubbles.splice(index, 1);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            frameCount++;

            if (frameCount % 40 === 0 && bubbles.length < 15) {
                bubbles.push(new Bubble());
            }

            for (let i = bubbles.length - 1; i >= 0; i--) {
                bubbles[i].update();
                bubbles[i].draw(ctx);
                
                if (bubbles[i].y + bubbles[i].r < -50) {
                    bubbles.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Dedicated tap handler for both touch and mouse
        function handleTap(tapX, tapY) {
            initAudio();
            let hit = false;
            
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const dist = Math.hypot(bubbles[i].x - tapX, bubbles[i].y - tapY);
                if (dist <= bubbles[i].r + 30) { // +30px generous toddler hitbox
                    popBubble(i);
                    hit = true;
                    break; 
                }
            }
            
            if (!hit) {
                const newBubble = new Bubble(tapX, tapY);
                bubbles.push(newBubble);
                popBubble(bubbles.length - 1);
            }
        }

        // Mobile touch events directly on canvas
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents double-firing with mousedown on mobile
            handleTap(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // Desktop mouse events directly on canvas
        canvas.addEventListener('mousedown', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        // Keyboard mashing
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { window.location.href = 'index.html'; return; }
            if (e.repeat) return;
            initAudio();
            
            if (bubbles.length > 0) {
                const randomIndex = Math.floor(Math.random() * bubbles.length);
                popBubble(randomIndex);
            } else {
                bubbles.push(new Bubble(width / 2, height / 2));
                popBubble(0);
            }
        });

        window.onload = () => {
            for(let i=0; i<8; i++) {
                bubbles.push(new Bubble(
                    Math.random() * width, 
                    Math.random() * height + height/2 
                ));
            }
            animate();
        };
    </script>
</body>
</html>
