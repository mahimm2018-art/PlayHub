<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adi's Nom Nom</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Fredoka', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 100;
            padding: 10px 15px; background: rgba(0,0,0,0.1); border: none; border-radius: 8px;
            font-size: 1rem; cursor: pointer; color: #333; font-family: sans-serif;
        }
        #back-btn:active { background: rgba(0,0,0,0.2); }

        canvas {
            display: block; width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        #instruction {
            font-size: clamp(1.5rem, 4vw, 3rem); color: #2f3542;
            text-shadow: 2px 2px 0px #fff; animation: fadeOut 3s forwards; 
            animation-delay: 2.5s; text-align: center; opacity: 0.8;
            margin-top: 250px; /* Kept below the monster */
        }

        @keyframes fadeOut {
            0% { opacity: 0.8; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <button id="back-btn" ondblclick="window.location.href='index.html'" onkeydown="if(event.key==='Enter') window.location.href='index.html'">
        Double-Tap / Esc to Exit
    </button>

    <canvas id="canvas"></canvas>
    
    <div id="ui-layer">
        <div id="instruction">Tap to feed the hungry monster!</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let foods = [];
        const foodTypes = ['🍎', '🍌', '🍕', '🥕', '🍩', '🥦', '🍉', '🧀', '🍔', '🌮', '🍓', '🍇'];

        // Monster state
        let monster = {
            x: 0, y: 0,
            scale: 1,
            targetScale: 1,
            chewTimer: 0
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            monster.x = width / 2;
            monster.y = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Audio Context for "Chomp" sound ---
        let audioCtx = null;
        let audioStarted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioStarted = true;
        }

        function playChompSound() {
            if (!audioStarted || !audioCtx) return;
            const t = audioCtx.currentTime;
            
            // Randomize pitch slightly so rapid feeding sounds funny and varied
            const pitchShift = Math.random() * 50 - 25; 
            
            // Low crunchy base
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(120 + pitchShift, t);
            osc1.frequency.exponentialRampToValueAtTime(40, t + 0.15);
            gain1.gain.setValueAtTime(0.3, t);
            gain1.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(t);
            osc1.stop(t + 0.15);
            
            // High sharp crunch
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(600 + pitchShift, t);
            osc2.frequency.exponentialRampToValueAtTime(100, t + 0.1);
            gain2.gain.setValueAtTime(0.15, t);
            gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(t);
            osc2.stop(t + 0.1);
        }

        // --- Game Classes ---
        class Food {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.emoji = foodTypes[Math.floor(Math.random() * foodTypes.length)];
                this.size = Math.random() * 20 + 50; // 50px to 70px
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
            }

            update() {
                // Fly towards the monster's mouth in the center
                const dx = monster.x - this.x;
                const dy = monster.y - this.y;
                const dist = Math.hypot(dx, dy);
                
                // Ease-in speed
                this.x += dx * 0.08;
                this.y += dy * 0.08;
                this.rotation += this.rotSpeed;
                
                // Return true if it reached the mouth
                return dist < 40; 
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        function drawMonster() {
            ctx.save();
            ctx.translate(monster.x, monster.y);
            
            // Bounce spring logic
            monster.scale += (monster.targetScale - monster.scale) * 0.2;
            ctx.scale(monster.scale, monster.scale);

            // Monster Body
            const bodySize = Math.min(width, height) * 0.25;
            ctx.beginPath();
            ctx.arc(0, 0, bodySize, 0, Math.PI * 2);
            ctx.fillStyle = '#2ed573'; // Friendly bright green
            ctx.shadowColor = 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 15;
            ctx.fill();
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#27ae60';
            ctx.stroke();

            // Calculate where the eyes should look (towards the closest food)
            let lookX = 0;
            let lookY = 0;
            if (foods.length > 0) {
                // Find closest food
                let closest = foods[0];
                let minDist = Math.hypot(closest.x - monster.x, closest.y - monster.y);
                for(let i=1; i<foods.length; i++) {
                    let d = Math.hypot(foods[i].x - monster.x, foods[i].y - monster.y);
                    if (d < minDist) { minDist = d; closest = foods[i]; }
                }
                const angle = Math.atan2(closest.y - monster.y, closest.x - monster.x);
                lookX = Math.cos(angle) * (bodySize * 0.1);
                lookY = Math.sin(angle) * (bodySize * 0.1);
            }

            // Eyes
            const eyeDist = bodySize * 0.35;
            const eyeSize = bodySize * 0.25;
            const pupilSize = bodySize * 0.1;
            const eyeY = -bodySize * 0.2;

            // Whites of eyes
            ctx.fillStyle = 'white';
            ctx.shadowColor = 'transparent';
            ctx.beginPath();
            ctx.arc(-eyeDist, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.arc(eyeDist, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            // Pupils (Looking at food)
            ctx.fillStyle = '#2f3542';
            ctx.beginPath();
            ctx.arc(-eyeDist + lookX, eyeY + lookY, pupilSize, 0, Math.PI * 2);
            ctx.arc(eyeDist + lookX, eyeY + lookY, pupilSize, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            ctx.fillStyle = '#2f3542';
            ctx.beginPath();
            if (monster.chewTimer > 0) {
                // Chewing (Mouth closed into a squiggly line or oval)
                const chewPhase = Math.sin(monster.chewTimer * 0.8) * 10;
                ctx.ellipse(0, bodySize * 0.3 + chewPhase, bodySize * 0.4, bodySize * 0.1, 0, 0, Math.PI * 2);
                monster.chewTimer--;
            } else {
                // Open wide! Waiting for food
                ctx.arc(0, bodySize * 0.3, bodySize * 0.4, 0, Math.PI * 2);
            }
            ctx.fill();
            
            // Return scale back to normal slowly
            monster.targetScale = 1.0;

            ctx.restore();
        }

        function triggerFoodSpawn(x, y) {
            initAudio();
            // If they tap exactly in the center, spawn it slightly off-center so the animation plays
            if (Math.abs(x - monster.x) < 50 && Math.abs(y - monster.y) < 50) {
                x += 100;
            }
            foods.push(new Food(x, y));
        }

        // --- Main Loop ---
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Monster first so food flies OVER it
            drawMonster();

            // Update and draw food
            for (let i = foods.length - 1; i >= 0; i--) {
                const reachedMouth = foods[i].update();
                foods[i].draw(ctx);
                
                if (reachedMouth) {
                    playChompSound();
                    monster.scale = 1.25; // Bounce the monster!
                    monster.chewTimer = 15; // Start chewing animation
                    foods.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- Inputs ---
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#back-btn')) return;
            if (e.isPrimary) {
                triggerFoodSpawn(e.clientX, e.clientY);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { window.location.href = 'index.html'; return; }
            if (e.repeat) return;
            
            // Keyboard drops food from random edges of the screen
            let spawnX, spawnY;
            if (Math.random() > 0.5) {
                spawnX = Math.random() > 0.5 ? -50 : width + 50;
                spawnY = Math.random() * height;
            } else {
                spawnX = Math.random() * width;
                spawnY = Math.random() > 0.5 ? -50 : height + 50;
            }
            triggerFoodSpawn(spawnX, spawnY);
        });

        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
