<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adi's Animals</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #e8f5e9; font-family: 'Comic Sans MS', sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
        }

        /* --- START OVERLAY --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(232, 245, 233, 0.95);
            display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        #start-overlay button {
            font-size: 3rem; padding: 20px 40px; background: #2ed573; color: white;
            border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 8px 0 #218c53;
        }

        /* --- BACK BUTTON --- */
        #back-btn {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            padding: 10px 15px; background: rgba(0,0,0,0.1); border: none; border-radius: 8px;
            font-size: 1rem; cursor: pointer; color: #333;
        }
        #back-btn:active { background: rgba(0,0,0,0.2); }

        /* --- GAME ELEMENTS --- */
        #game-area { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .pop-element {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            animation: pop 0.4s ease-out forwards; pointer-events: none;
        }
        .emoji { font-size: 8rem; line-height: 1; }
        .word { font-size: 3rem; font-weight: bold; background: white; padding: 5px 20px; border-radius: 20px; border: 3px solid; margin-top: 10px; }
        
        @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Start Button unlocks audio -->
    <div id="start-overlay" onclick="startGame()">
        <button>Tap to Start!</button>
    </div>
    
    <!-- Native Double Click to exit -->
    <button id="back-btn" ondblclick="window.location.href='index.html'" onkeydown="if(event.key==='Enter') window.location.href='index.html'">
        Double-Tap / Esc to Exit
    </button>
    
    <!-- Main game canvas clicks -->
    <div id="game-area" onclick="spawn(event.clientX, event.clientY)"></div>

    <script>
        const animals = [
            { e: '🐶', w: 'Dog', c: '#ff4757' }, { e: '🐱', w: 'Cat', c: '#ffa502' },
            { e: '🐮', w: 'Cow', c: '#2f3542' }, { e: '🐸', w: 'Frog', c: '#2ed573' },
            { e: '🦆', w: 'Duck', c: '#ffa502' }, { e: '🐷', w: 'Pig', c: '#ff6b81' },
            { e: '🐭', w: 'Mouse', c: '#747d8c' }, { e: '🐴', w: 'Horse', c: '#8B4513' }
        ];
        
        let audioCtx = null;
        let active = false;

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            active = true;
            
            // Wake up Audio
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if(AudioContext) {
                audioCtx = new AudioContext();
                if(audioCtx.state === 'suspended') audioCtx.resume();
            }
            // Wake up Speech
            if ('speechSynthesis' in window) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if(!active) return;
            if(e.key === 'Escape') { window.location.href = 'index.html'; return; }
            if(e.key === ' ') { document.getElementById('game-area').innerHTML = ''; return; }
            if(e.repeat) return;
            
            const x = Math.max(100, Math.random() * (window.innerWidth - 200));
            const y = Math.max(100, Math.random() * (window.innerHeight - 200));
            spawn(x, y);
        });

        function spawn(x, y) {
            if(!active) return;
            
            const area = document.getElementById('game-area');
            area.innerHTML = ''; // Clear previous animal immediately
            
            const a = animals[Math.floor(Math.random() * animals.length)];
            
            const div = document.createElement('div');
            div.className = 'pop-element';
            div.style.left = (x - 100) + 'px';
            div.style.top = (y - 120) + 'px';
            div.innerHTML = `<div class="emoji">${a.e}</div><div class="word" style="color:${a.c}; border-color:${a.c}">${a.w}</div>`;
            area.appendChild(div);

            // Speech
            try {
                window.speechSynthesis.cancel();
                let u = new SpeechSynthesisUtterance(a.w);
                u.rate = 0.9;
                u.pitch = 1.3;
                window.speechSynthesis.speak(u);
            } catch(e) { console.log(e); }
            
            // Simple synth beep instead of complex procedural sounds
            if(audioCtx) {
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300 + Math.random()*200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } catch(e) { console.log(e); }
            }
        }
    </script>
</body>
</html>
