<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Ball Pit</title>
    <meta name="description" content="ToddlerMash is a free, safe, and ad-free keyboard and touch game hub for babies and toddlers. Smash keys and tap the screen for colors, animals, vehicles, and sounds!">
    <meta name="keywords" content="toddlers keyboard game, baby smash game, free toddler games, ad-free baby games, touch screen games for toddlers, cause and effect games">
    <meta name="robots" content="index, follow">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #fffbe0 0%, #ffdfba 100%);
            font-family: 'Fredoka', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- NATIVE BACK BUTTON --- */
        #back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 100;
            padding: 10px 15px; background: rgba(0,0,0,0.1); border: none; border-radius: 8px;
            font-size: 1rem; cursor: pointer; color: #333; font-family: sans-serif;
        }
        #back-btn:active { background: rgba(0,0,0,0.2); }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #title {
            font-size: clamp(2.5rem, 7vw, 6rem);
            color: #ff8b94;
            text-shadow: 3px 3px 0px #fff, 0px 5px 15px rgba(0,0,0,0.1);
            animation: float 3s ease-in-out infinite;
            opacity: 0.8;
            text-align: center;
        }

        #instruction {
            font-size: clamp(1.2rem, 3.5vw, 2.5rem);
            color: #55b4b0;
            margin-top: 15px;
            text-shadow: 2px 2px 0px #fff;
            animation: pulse 2s infinite;
            text-align: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Native Double Click to exit -->
    <button id="back-btn" ondblclick="window.location.href='index.html'" onkeydown="if(event.key==='Enter') window.location.href='index.html'">
        Double-Tap / Esc to Exit
    </button>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="title">The Ball Pit!</div>
        <div id="instruction">Tap or Press Any Key</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');

        let width, height, groundLevel;
        const balls = [];
        const MAX_BALLS = 100; // Keep performance smooth

        // The fun balls to drop!
        const ballTypes = ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🎱', '🧶'];

        // Physics constants
        const gravity = 0.6;
        const friction = 0.99; // Air resistance
        const groundFriction = 0.90; // Rolling resistance
        const restitution = 0.75; // Bounciness

        // Resize canvas correctly to fit inside mobile browser viewports without toolbar cutoff
        function resize() {
            width = window.innerWidth;
            // Use clientHeight or innerHeight safely, adding a bottom padding buffer for mobile toolbars
            height = window.innerHeight;
            
            canvas.width = width;
            canvas.height = height;

            // Define floor level slightly above the very bottom edge so mobile toolbars don't clip balls
            const isMobile = width < 768;
            groundLevel = height - (isMobile ? 80 : 40);
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 200));
        resize();

        // Audio Setup
        let audioCtx = null;
        let audioStarted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioStarted = true;
            instruction.style.display = 'none'; // Hide instructions once interacting
        }

        // Procedural Sound Effects
        function playSound(type, velocity = 10) {
            if (!audioStarted || !audioCtx) return;

            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            const volume = Math.min(Math.max(velocity / 40, 0.05), 0.3);

            if (type === 'spawn') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.15);
            } else if (type === 'bounce') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(volume, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.1);
            }
        }

        // Ball Class
        class Ball {
            constructor(x, y) {
                this.radius = Math.random() * 15 + 30; // Responsive ball sizing
                this.x = x;
                this.y = y;
                
                this.vx = (Math.random() - 0.5) * 15; 
                this.vy = (Math.random() - 0.5) * 5; 
                
                this.emoji = ballTypes[Math.floor(Math.random() * ballTypes.length)];
                
                this.angle = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.vy += gravity;
                
                this.vx *= friction;
                this.vy *= friction;
                
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vRot;

                // Floor collision (bounded by safe mobile groundLevel)
                if (this.y + this.radius > groundLevel) {
                    this.y = groundLevel - this.radius;
                    this.vy *= -restitution;
                    this.vx *= groundFriction;
                    this.vRot *= groundFriction;
                    
                    if (Math.abs(this.vy) > 3) {
                        playSound('bounce', Math.abs(this.vy));
                    }
                }

                // Ceiling collision
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -restitution;
                }

                // Wall collisions
                if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -restitution;
                } else if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -restitution;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.font = `${this.radius * 2}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
                
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        // Spawn a new ball
        function spawnBall(x, y) {
            initAudio();
            
            const spawnX = x !== undefined ? x : Math.random() * (width - 100) + 50;
            const spawnY = y !== undefined ? y : 50;

            const newBall = new Ball(spawnX, spawnY);
            balls.push(newBall);
            playSound('spawn');

            if (balls.length > MAX_BALLS) {
                balls.shift(); 
            }
        }

        // Game Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < balls.length; i++) {
                balls[i].update();
                balls[i].draw(ctx);
            }

            requestAnimationFrame(animate);
        }

        // Input Listeners
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#back-btn')) return;
            
            if (e.isPrimary) {
                spawnBall(e.clientX, e.clientY);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { window.location.href = 'index.html'; return; }

            if ([32, 37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
            if (e.repeat) return;
            
            spawnBall();
        });

        // Start loop
        window.onload = () => {
            animate();
        };

    </script>
</body>
</html>
